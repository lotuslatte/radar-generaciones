/* RADAR palette (same tokens as 03 App simulador). The game keeps one fixed
 * look in both light and dark system themes: a night band for the bars and a
 * paper table for the cards, like Reigns. */
:root {
  --ink: #1f2a44;
  --ground: #f7f5f0;
  --paper: #ffffff;
  --muted: #5f6470;
  --line: #e2ddd3;
  --cut: #2e7d4f;
  --go: #b5651d;
  --flag: #c0392b;
  --comm: #2f6db5;
  --night: #14213d;
  --night-2: #1f2f52;
  --night-line: #2c3f6b;
  --night-text: #f4f1ea;
  --night-muted: #a9b3c7;
  --gold: #f2b134;
  --mint: #7fd1a4;
  --table: #e9e3d8;
  --radius: 14px;
  color-scheme: light;
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #cfc8bb; color: var(--ink); -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--comm); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app {
  position: relative;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: var(--table);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
@media (min-width: 520px) {
  #app { height: min(900px, 100dvh); margin-top: max(0px, calc((100dvh - 900px) / 2)); box-shadow: 0 10px 40px rgba(20, 33, 61, 0.25); }
}

/* ---------- screens with scroll (title, picker, feedback, memories, help) ---------- */
.screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px 16px 32px; }
.screen.night { background: var(--night); color: var(--night-text); }
.screen h1 { font-size: 30px; font-weight: 900; letter-spacing: 0.01em; }
.screen h2 { font-size: 13px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.night h2 { color: var(--night-muted); }
.lead { font-size: 17px; line-height: 1.45; margin-top: 10px; }
.small { font-size: 13px; line-height: 1.4; }
.muted { color: var(--muted); }
.night .muted { color: var(--night-muted); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 12px 18px; margin-top: 12px;
  border: 0; border-radius: 999px; font-weight: 800; font-size: 16px;
  background: var(--gold); color: var(--night);
}
.btn.ghost { background: transparent; border: 2px solid currentColor; color: inherit; }
.btn.quiet { background: rgba(255, 255, 255, 0.08); color: inherit; }
.screen:not(.night) .btn.quiet { background: var(--paper); border: 1px solid var(--line); }
.btn.small { min-height: 40px; font-size: 14px; }
.back { background: none; border: 0; padding: 6px 0; font-weight: 800; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }

/* title */
.title-hero { text-align: center; padding: 36px 8px 8px; }
.title-hero .logo { font-size: 46px; font-weight: 1000; letter-spacing: 0.14em; color: var(--gold); }
.title-hero .logo-sub { font-size: 20px; font-weight: 800; letter-spacing: 0.32em; margin-top: 2px; }
.title-hero .radar { width: 120px; height: 120px; margin: 22px auto 8px; display: block; }
.note { margin-top: 22px; padding: 14px; border-radius: var(--radius); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--night-line); }

/* profile picker */
.pick { display: block; width: 100%; text-align: left; margin-top: 12px; padding: 14px; border-radius: var(--radius); border: 2px solid var(--night-line); background: var(--night-2); }
.pick:hover, .pick:focus-visible { border-color: var(--gold); }
.pick-head { display: flex; gap: 12px; align-items: center; }
.pick-head svg.portrait { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; }
.pick-name { font-size: 19px; font-weight: 900; }
.pick-tag { display: inline-block; margin-top: 2px; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--night); font-size: 12px; font-weight: 900; }
.pick p { margin-top: 10px; font-size: 15px; line-height: 1.4; color: var(--night-text); }
.mini-bars { display: flex; gap: 10px; margin-top: 10px; }
.mini-bar { flex: 1; font-size: 11px; color: var(--night-muted); font-weight: 800; }
.mini-bar span { display: block; height: 6px; border-radius: 3px; background: var(--night-line); margin-top: 4px; overflow: hidden; }
.mini-bar span i { display: block; height: 100%; background: var(--gold); }

/* ---------- game screen ---------- */
.bars {
  background: var(--night); color: var(--night-text);
  display: flex; justify-content: space-around; align-items: flex-end;
  padding: 10px 12px 10px; padding-top: max(10px, env(safe-area-inset-top));
}
.bar { position: relative; display: flex; flex-direction: column; align-items: center; width: 72px; }
.bar .dot-slot { height: 14px; display: flex; align-items: center; justify-content: center; }
/* Preview: an arrow over each bar the choice moves, up or down, small or big. */
.bar .dot { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; opacity: 0; transform: scale(0.4); transition: opacity 0.12s, transform 0.12s; }
.bar .dot.up { border-bottom: 9px solid #7fd38b; }
.bar .dot.down { border-top: 9px solid #ff9b6b; }
.bar .dot.small { opacity: 1; transform: scale(0.9); }
.bar .dot.big { opacity: 1; transform: scale(1.5); }
.bar.hl .name { color: var(--night-text); }
.bar.hl .icon .outline { stroke: var(--night-text); }
.bar svg.icon { width: 40px; height: 40px; }
.bar .icon .base { fill: none; stroke: var(--night-line); stroke-width: 1.6; }
.bar .icon .fillpart { fill: var(--night-text); }
.bar .icon .outline { fill: none; stroke: var(--night-muted); stroke-width: 1.4; }
.bar.danger .icon .fillpart { fill: var(--gold); }
.bar.danger .icon .outline { stroke: var(--gold); }
.bar.danger { animation: warn 1.2s ease-in-out infinite; }
@keyframes warn { 50% { transform: translateY(-2px); } }
.bar .clip-rect { transition: y 0.5s ease, height 0.5s ease; }
.bar .name { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; margin-top: 3px; color: var(--night-muted); }
.bar.up .name { color: var(--mint); }
.bar.down .name { color: var(--gold); }

.table { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 0; min-height: 0; }
.scene {
  width: 100%; min-height: 84px; display: flex; flex-direction: column; justify-content: center;
  text-align: center; font-size: 18px; line-height: 1.38; font-weight: 700; padding: 4px 6px 12px;
}
.scene .who { font-size: 13px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.scene .end-title { font-size: 24px; font-weight: 1000; margin-bottom: 6px; }

.stack { position: relative; width: min(100%, 330px); flex: 1; max-height: 400px; min-height: 220px; }
.stack .under { position: absolute; inset: 8px -6px -6px 6px; border-radius: 18px; background: #d6cebf; }
.card {
  position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
  background: var(--paper); box-shadow: 0 6px 18px rgba(20, 33, 61, 0.18);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  transition: transform 0.25s ease, opacity 0.25s ease;
  display: flex; flex-direction: column;
}
.card.dragging { transition: none; cursor: grabbing; }
.card.fly-L { transform: translateX(-140%) rotate(-24deg); opacity: 0; }
.card.fly-R { transform: translateX(140%) rotate(24deg); opacity: 0; }
.card.enter { animation: enter 0.28s ease; }
@keyframes enter { from { transform: translateY(18px) scale(0.96); opacity: 0; } }
.card .face { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.card svg.portrait { width: 100%; height: 100%; display: block; }
.card .nameplate { padding: 8px 12px 10px; text-align: center; font-weight: 900; font-size: 15px; border-top: 1px solid var(--line); }
.card .nameplate small { display: block; font-weight: 700; font-size: 12px; color: var(--muted); }
.card .choice {
  position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px; min-height: 64px;
  background: rgba(20, 33, 61, 0.92); color: var(--night-text); font-weight: 900; font-size: 17px; line-height: 1.25;
  opacity: 0; transition: opacity 0.1s; pointer-events: none; display: flex; align-items: center;
}
.card .choice.L { justify-content: flex-start; text-align: left; }
.card .choice.R { justify-content: flex-end; text-align: right; }
.card .choice.show { opacity: 1; }
.card.end-card { background: var(--night); color: var(--night-text); }
.card.end-card .nameplate { border-top-color: var(--night-line); }

/* chat face */
.chat { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; background: #efe9df; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; color: #fff; font-weight: 900; font-size: 14px; }
.chat-head .av { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: rgba(255, 255, 255, 0.25); }
.chat-head .av svg { width: 100%; height: 100%; }
.chat-head .ch { margin-left: auto; font-size: 11px; font-weight: 800; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.06em; }
.chat-body { flex: 1; overflow-y: auto; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.bubble { align-self: flex-start; max-width: 88%; background: #fff; border-radius: 4px 14px 14px 14px; padding: 8px 11px; font-size: 15px; line-height: 1.35; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.06); }
.bubble.sys { align-self: center; background: #fbefd2; border-radius: 999px; font-size: 13px; font-weight: 800; padding: 5px 12px; }
.bubble.marked { box-shadow: inset 3px 0 0 var(--flag), 0 1px 1px rgba(0, 0, 0, 0.06); }
.bubble .sig { display: flex; gap: 4px; align-items: center; margin-top: 4px; font-size: 12px; font-weight: 900; color: var(--flag); }
.bubble .sig svg { width: 13px; height: 13px; fill: var(--flag); }

.choices { width: 100%; display: flex; gap: 10px; padding: 14px 0 6px; }
.choices button {
  flex: 1; min-height: 56px; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--ink);
  background: var(--paper); font-weight: 800; font-size: 15px; line-height: 1.2; display: flex; align-items: center; gap: 6px;
}
.choices button.L { justify-content: flex-start; text-align: left; }
.choices button.R { justify-content: flex-end; text-align: right; }
.choices button.hover, .choices button:focus-visible { background: var(--night); color: var(--night-text); }
.choices button.one { justify-content: center; text-align: center; background: var(--night); color: var(--night-text); border-color: var(--night); }
.choices button svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
.status { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; color: var(--muted); padding: 4px 2px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.status .radar-on { color: var(--flag); display: inline-flex; gap: 4px; align-items: center; }
.status .radar-on svg { width: 14px; height: 14px; fill: currentColor; }
.status .menu-btn { background: none; border: 0; padding: 4px 6px; font-weight: 900; color: var(--muted); }

/* ---------- feedback ---------- */
.fb-head { text-align: center; padding-top: 6px; }
.fb-head .eyebrow { font-size: 12px; font-weight: 900; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
.fb-head h1 { margin-top: 6px; }
.fb-head .weeks { margin-top: 4px; color: var(--night-muted); font-weight: 800; }
.fb-msg { margin-top: 16px; padding: 14px; border-radius: var(--radius); background: var(--night-2); font-size: 16px; line-height: 1.45; }
.fb-msg.chain { background: var(--cut); color: #fff; }
.attempt { margin-top: 14px; padding: 14px; border-radius: var(--radius); background: var(--paper); color: var(--ink); }
.attempt h3 { font-size: 17px; font-weight: 900; }
.attempt .ch { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.journey { display: flex; gap: 3px; margin: 12px 0 4px; }
.journey .seg { flex: 1; height: 10px; border-radius: 5px; background: var(--line); position: relative; }
.journey .seg.on { background: #8fa2c4; }
.journey .seg.cut { background: var(--cut); }
.journey .seg.met { background: var(--go); }
.journey-labels { display: flex; gap: 3px; font-size: 10px; font-weight: 800; color: var(--muted); }
.journey-labels span { flex: 1; text-align: center; line-height: 1.15; }
.journey-labels span.here { color: var(--ink); }
.outcome { margin-top: 10px; font-weight: 800; font-size: 15px; }
.outcome.cut { color: var(--cut); }
.outcome.met { color: var(--go); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #eef2f8; color: var(--ink); }
.chip.good { background: #dcefe3; color: #1d5a37; }
.chip.warn { background: #fbefd2; color: #7a5410; }
.attempt h4 { font-size: 13px; font-weight: 900; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.sig-row { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.35; }
.sig-row:first-of-type { border-top: 0; }
.sig-row .mk { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; color: #fff; margin-top: 1px; }
.sig-row .mk.ok { background: var(--cut); }
.sig-row .mk.miss { background: var(--go); }
.sig-row b { display: block; }
.sig-row .fn { font-size: 12px; color: var(--muted); font-weight: 800; }
.exits li { position: relative; padding: 4px 0 4px 16px; font-size: 14px; line-height: 1.35; }
.exits li::before { content: ''; position: absolute; left: 2px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--cut); }

.letters { display: flex; gap: 6px; }
.letter { flex: 1; border-radius: 12px; padding: 10px 4px 8px; text-align: center; background: var(--night-2); border: 2px solid var(--night-line); color: var(--night-muted); }
.letter .lt { font-size: 26px; font-weight: 1000; line-height: 1; }
.letter .ln { font-size: 10px; font-weight: 900; margin-top: 4px; letter-spacing: 0.02em; }
.letter.lit { background: var(--gold); border-color: var(--gold); color: var(--night); }
.letter-tips { margin-top: 10px; }
.letter-tips li { padding: 8px 0; border-top: 1px solid var(--night-line); font-size: 14px; line-height: 1.4; }
.letter-tips li b { color: var(--gold); }
.letter-tips li.done b { color: var(--mint); }

.help-line { display: flex; gap: 12px; align-items: center; padding: 12px; margin-top: 8px; border-radius: var(--radius); background: var(--night-2); text-decoration: none; color: inherit; }
.screen:not(.night) .help-line { background: var(--paper); border: 1px solid var(--line); }
.help-line .num { min-width: 52px; height: 40px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: var(--night); display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 13px; text-align: center; line-height: 1.05; }
.help-line b { display: block; }
.help-line span span { font-size: 13px; line-height: 1.35; }
.steps li { padding: 10px 0; border-top: 1px solid var(--night-line); font-size: 15px; line-height: 1.4; }
.screen:not(.night) .steps li { border-top-color: var(--line); }

/* memories */
.mem-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mem-tile { border-radius: 12px; padding: 12px; min-height: 78px; background: var(--night-2); border: 1px solid var(--night-line); font-size: 13px; line-height: 1.3; }
.mem-tile b { display: block; font-size: 15px; margin-bottom: 4px; }
.mem-tile.locked { opacity: 0.5; border-style: dashed; }
.mem-tile.locked b { letter-spacing: 0.2em; }
.gen-list li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--night-line); font-size: 14px; align-items: center; }
.gen-list .n { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--night); font-weight: 1000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }

/* next girl transition */
.passing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 24px 40px; background: var(--night); color: var(--night-text); }
.passing svg.portrait { width: 132px; height: 132px; border-radius: 50%; margin-bottom: 18px; }
.passing .eyebrow { font-size: 12px; font-weight: 900; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
.passing h1 { font-size: 28px; font-weight: 1000; margin-top: 6px; }
.passing p { margin-top: 12px; font-size: 16px; line-height: 1.45; max-width: 340px; }

@media (max-height: 680px) {
  .scene { font-size: 16px; min-height: 70px; }
  .stack { min-height: 190px; }
  .bubble { font-size: 14px; }
  .choices button { min-height: 50px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .bar .clip-rect, .bar .dot { transition: none; }
  .bar.danger, .card.enter { animation: none; }
}

/* v0.2: deeds, new-card mark, collection */
.new-tag { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--night); font-size: 12px; font-weight: 900; }
.scene .end-title.deed { color: var(--gold); }
.deeds-now { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: 13px; }
.deeds-now > b { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
.deed-mini, .deed-row { display: flex; gap: 8px; align-items: flex-start; }
.deed-mini small, .deed-row small { display: block; opacity: .85; line-height: 1.35; }
.deed-row { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--night-line); font-size: 14px; }
.deed-row.done { border-color: var(--gold); }
.deed-row i { font-style: normal; display: block; margin-top: 2px; color: var(--gold); }
.dl { flex-shrink: 0; width: auto; min-width: 24px; padding: 0 6px; height: 24px; border-radius: 12px; background: var(--night-line); font-size: 11px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; }
.deed-row.done .dl { background: var(--gold); color: var(--night); }
.fn-box { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--night-line); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.sig-got { display: flex; gap: 6px; } .sig-got svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--gold); }
.sig-got small { display: block; opacity: .8; }
.routes { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.pick.locked { opacity: .6; border-style: dashed; }
.deeds-now .dl { background: var(--night); color: #fff; }

/* guide to the four bars */
.guide-bar { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--night-2); border: 1px solid var(--night-line); display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; line-height: 1.4; }
.gb-head { display: flex; align-items: center; gap: 8px; font-size: 17px; } .gb-head svg { width: 30px; height: 30px; }
.gb-ends { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gb-ends span { background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px; font-size: 13px; }
.gb-ends i { display: block; font-style: normal; font-weight: 900; color: #ff9b6b; margin-bottom: 2px; }
.gb-bal { color: #7fd38b; }
.gb-head svg, .gb-head svg path, .gb-head svg circle { fill: #f4efe6; }

.fb-bars { display: flex; flex-direction: column; gap: 6px; }
.fb-bar { display: grid; grid-template-columns: 72px 1fr 92px; gap: 8px; align-items: center; font-size: 14px; }
.fb-bar i { height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; } .fb-bar i b { display: block; height: 100%; background: #7fd38b; }
.fb-bar.alta i b, .fb-bar.baja i b { background: #ff9b6b; }
.fb-bar small { font-size: 12px; opacity: .85; }

/* ---------- v0.4: four acts, card frames, year line, subplots ---------- */
:root {
  --table-0: #eee9df;   /* Inicio: light */
  --table-1: #e9e3d8;   /* La primera oferta */
  --table-2: #ddd4c4;   /* La crisis: darker */
  --table-3: #efe0c8;   /* El cierre: warm December */
  --t-sueno: #6b4fa0;
  --t-familia: #1d7f74;
  --t-amiga: #b8336a;
  --branch: #85590a;
  --memory: #7a5a3a;
}
#app.act-0 { background: var(--table-0); }
#app.act-1 { background: var(--table-1); }
#app.act-2 { background: var(--table-2); }
#app.act-3 { background: var(--table-3); }
#app { transition: background-color 0.8s ease; }

.top { position: relative; background: var(--night); color: var(--night-text); z-index: 2; }
.top .bars { padding-bottom: 4px; }
.year { display: flex; align-items: center; gap: 8px; padding: 0 14px 9px; font-size: 11px; font-weight: 800; color: var(--night-muted); }
.year > span:first-child { width: 64px; }
.year .act-name { width: 96px; text-align: right; color: var(--gold); }
.yearline { flex: 1; }
.yl-track { position: relative; display: flex; gap: 2px; height: 6px; }
.yl-act { position: relative; height: 100%; border-radius: 3px; background: var(--night-line); overflow: hidden; }
.yl-act b { position: absolute; inset: 0 auto 0 0; background: var(--night-muted); }
.yl-here { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--night); }
.yl-offer { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--night-text); box-shadow: 0 0 0 2px var(--night); }
.yl-offer.cut { background: var(--mint); }
.yl-offer.open { background: #ff9b6b; }
.yl-offer.met { background: #ff9b6b; }
.yearline.big { margin: 16px 0 4px; }
.yearline.big .yl-track { height: 10px; }
.yearline.big .yl-here { display: none; }
.yearline.big .yl-offer { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
.yl-acts { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--night-muted); }

/* Frames: a band on top of the card says what kind of card it is. */
.card .band { display: flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12px; font-weight: 900; letter-spacing: 0.04em; color: #fff; }

.band.t-familia { background: var(--t-familia); }

.pips { display: inline-flex; gap: 3px; }

.status .threads { display: inline-flex; gap: 10px; background: none; border: 0; padding: 2px 4px; }

.thr svg.t-icon { width: 14px; height: 14px; fill: currentColor; }

.toast {
  align-self: center; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
  padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--night); color: var(--night-text);
  font-size: 13px; font-weight: 800; text-align: left; animation: toast 0.5s ease;
}
.toast > span { display: flex; align-items: center; gap: 8px; }
.toast .dl { background: var(--gold); color: var(--night); }
@keyframes toast { from { opacity: 0; transform: scale(0.92); } }

.fb-threads { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; }
.fb-threads .thr { gap: 5px; }
.night .thr.t-sueno { color: #c3aef0; }
.night .thr.t-familia { color: #7fd1c3; }

.menu-thr svg.t-icon { width: 20px; height: 20px; fill: currentColor; }

.menu-thr .pips { margin-left: auto; }
.menu-thr.t-sueno { color: #c3aef0; }
.menu-thr.t-familia { color: #7fd1c3; }
.menu-thr.t-amiga { color: #f2a2c2; }

.inherit { margin-top: 18px; width: 100%; max-width: 340px; text-align: left; }
.inherit .eyebrow { text-align: center; }
.inherit ul { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.inherit li { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--night-line); font-size: 14px; }
.inherit li small { display: block; color: var(--night-muted); line-height: 1.35; }
.inherit .dl { background: var(--gold); color: var(--night); }

@media (max-height: 680px) {
  .year { padding-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
  #app { transition: none; }
}

.fb-lines { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.4; text-align: left; }
.fb-lines li { padding-left: 10px; border-left: 3px solid var(--night-line); }

.status { gap: 8px; }
.status > span:first-child { white-space: nowrap; }
.status .threads { gap: 7px; }

// card('id', { kind, who, text, chat, when, L, R, ... }). A choice is
// { l: label, fx: { f, a, p, s }, set, mem, radar, tags, go, gap, cut, meet,
//   tell, capture, report, warn }. See README for the full schema.
function card(id, o) {
  o.id = id;
  RG_CONTENT.cards.push(o);
  return o;
}

// Memory cards show only to later girls, once an earlier one left that flag.
function memory(id, mem, who, text, L, R) {
  return card(id, { kind: 'memory', weight: 3, when: { mem: [mem] }, who: who, text: text, L: L, R: R });
}

// A recruitment arc: def holds title, channel, recruiter, start, recontact,
// meetCard, supportCard, recall and exits.
function arc(id, def) {
  def.id = id;
  RG_CONTENT.arcs[id] = def;
  return def;
}

// One card of an arc. chat lines are [text, signalId?]; "sys:" marks a
// system line (a Yape, a gift, "now writes to your number").
function ac(id, arcId, moment, who, text, chat, L, R, o) {
  o = o || {};
  o.kind = o.kind || 'arc';
  o.arc = arcId; o.moment = moment; o.who = who; o.text = text;
  if (chat) o.chat = { lines: chat, name: o.chatName };
  delete o.chatName;
  o.L = L; o.R = R;
  return card(id, o);
}

 * "right answer". */

  o = o || {};
  o.kind = o.kind || 'daily';
  o.who = who; o.text = text; o.L = L; o.R = R;
  return card(id, o);
}

/* Subplots that run through the year (v0.3, user request 2026-10-26): each
 * chain has three, «Sueño», «Familia» and «La amiga», in 3 or 4 steps spaced
 * over the year. A step reads the flag of the step before (`when.flags`) and
 * waits some weeks after it (`when.after`). Completing the dream sets
 * t_sueno_done (December variant «con un plan»); warning the friend sets
 * t_amiga_warned; ignoring her twice ends the year with story «amiga».
 * Flags are per girl, so the next girl of the chain lives the subplots again
 * with her own story. */
// Due weeks follow the four acts (v0.4): the first step of Sueño and Familia
// in «Inicio», the friend's first step early in «La primera oferta», the
// middle steps before the crisis ends and the closing steps before December.
var THREAD_DUE = { 1: 8, 2: 26, 3: 37, 4: 38 };
// Sueño and Familia keep their middle step out of «Inicio» and their closing
// step for «El cierre», so the year ends on them.
var THREAD_FROM = { 2: 12, 3: 31, 4: 33 };
function tstep(id, profile, thread, step, who, text, L, R, when) {
  when = when || {};
  when.profile = [profile];
  if (thread !== 'amiga' && THREAD_FROM[step] && !when.week) when.week = [THREAD_FROM[step], 40];
  return card(id, { kind: 'daily', weight: step === 1 ? 20 : 30, theme: thread === 'sueno' ? 'sueno' : thread === 'familia' ? 'familia' : 'amigas',
    thread: profile + '_' + thread, step: step, due: step === 1 && thread === 'amiga' ? 14 : THREAD_DUE[step],
    who: who, text: text, L: L, R: R, when: when });
}
function prev(flag, weeks) { return { flags: [flag], after: [flag, weeks] }; }

 *

 * every draw. Arc cards and after-effects are queued with a "wait" counted in
 * bag draws, so daily life keeps happening between the messages. */

  // The first act presents the girl, so the first offer waits until week 9.
  var ARC_WEEKS = [[9, 12], [19, 23], [27, 31]];
  var ARCS_PER_RUN = 3;

    { id: 'primera', name: 'La primera oferta', from: 9, to: 18 },

    primera: { daily: 1, radar: 1, thread: 1, branch: 1, memory: 0.6 },
    crisis: { daily: 1, radar: 0.8, thread: 1, branch: 1, memory: 0.4 },
    cierre: { daily: 1, radar: 0.8, thread: 1.5, branch: 1.5, memory: 0.3 }

  var DUE_SOON = 2;           // weeks before its due week a subplot or branch step jumps the bag

  function unlocks(game, C) {

  // what older girls opened and nobody lived yet,
  // then what opened by time (backup girls).
  function branchCards(C, deedId, profile) {

  function introCard(C, run) {

    for (i = 0; w.notFlags && i < w.notFlags.length; i++) if (run.flags[w.notFlags[i]]) return false;
    for (i = 0; w.mem && i < w.mem.length; i++) if (!run.mem[w.mem[i]]) return false;
    for (i = 0; w.notMem && i < w.notMem.length; i++) if (run.mem[w.notMem[i]]) return false;

  function isMeta(C, id) {

  /* ---------- view helpers ---------- */

  function vars(run, C, arcId) {

      return '<span class="yl-act" style="width:' + w.toFixed(2) + '%"><b style="width:' + fill.toFixed(1) + '%"></b></span>';
    }).join('');
    var dots = (offers || []).map(function (o) {
      return '<span class="yl-offer ' + o.state + '" style="left:' + ((o.week - 0.5) / total * 100).toFixed(2) + '%"></span>';
    }).join('');
    var here = '<span class="yl-here" style="left:' + ((Math.min(week, total) - 0.5) / total * 100).toFixed(2) + '%"></span>';
    return '<div class="yearline ' + (cls || '') + '" aria-hidden="true"><div class="yl-track">' + segs + dots + here + '</div></div>';
  }

  /* Flat portrait from a look: skin, hair, style, shirt, bg. */
  function portrait(look, cls) {
    look = look || {};
    var bg = look.bg || '#e2e5ec';
    var out = '<svg class="portrait ' + (cls || '') + '" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="200" fill="' + bg + '"/>';
    if (look.phone) {
      return out + '<rect x="62" y="34" width="76" height="132" rx="14" fill="#f4f1ea"/><rect x="70" y="50" width="60" height="96" rx="4" fill="#2f6db5"/>' +
        '<circle cx="100" cy="156" r="5" fill="#a9b3c7"/><rect x="78" y="62" width="44" height="10" rx="5" fill="#f4f1ea" opacity=".9"/>' +
        '<rect x="78" y="80" width="34" height="10" rx="5" fill="#f4f1ea" opacity=".6"/><circle cx="128" cy="44" r="12" fill="#c0392b"/></svg>';
    }
    if (look.group) {
      return out + person(look, 52, 0.62, '#b5651d') + person(look, 148, 0.62, '#2f6db5') + person(look, 100, 0.8, look.shirt) + '</svg>';
    }
    return out + person(look, 100, 1, look.shirt) + '</svg>';
  }
  function person(look, cx, k, shirt) {
    var skin = look.skin || '#b07a52', hair = look.hair || '#2b1a10', st = look.style || 'short';
    function X(v) { return (cx + (v - 100) * k).toFixed(1); }
    function Y(v) { return (200 - (200 - v) * k).toFixed(1); }
    function R(v) { return (v * k).toFixed(1); }
    var g = '';
    if (st === 'long' || st === 'curly') g += '<rect x="' + X(54) + '" y="' + Y(62) + '" width="' + R(92) + '" height="' + R(98) + '" rx="' + R(40) + '" fill="' + hair + '"/>';
    if (st === 'ponytail') g += '<ellipse cx="' + X(146) + '" cy="' + Y(104) + '" rx="' + R(14) + '" ry="' + R(30) + '" fill="' + hair + '"/>';
    g += '<path d="M' + X(36) + ' 200 C' + X(36) + ' ' + Y(150) + ' ' + X(64) + ' ' + Y(136) + ' ' + X(100) + ' ' + Y(136) + ' C' + X(136) + ' ' + Y(136) + ' ' + X(164) + ' ' + Y(150) + ' ' + X(164) + ' 200Z" fill="' + (shirt || '#2f6db5') + '"/>';
    g += '<rect x="' + X(88) + '" y="' + Y(116) + '" width="' + R(24) + '" height="' + R(26) + '" rx="' + R(8) + '" fill="' + skin + '"/>';
    g += '<circle cx="' + X(100) + '" cy="' + Y(88) + '" r="' + R(40) + '" fill="' + skin + '"/>';
    var hairTop = '<path d="M' + X(59) + ' ' + Y(86) + ' C' + X(58) + ' ' + Y(52) + ' ' + X(78) + ' ' + Y(44) + ' ' + X(100) + ' ' + Y(44) + ' C' + X(124) + ' ' + Y(44) + ' ' + X(142) + ' ' + Y(54) + ' ' + X(141) + ' ' + Y(86) + ' C' + X(128) + ' ' + Y(70) + ' ' + X(108) + ' ' + Y(64) + ' ' + X(86) + ' ' + Y(66) + ' C' + X(74) + ' ' + Y(68) + ' ' + X(64) + ' ' + Y(76) + ' ' + X(59) + ' ' + Y(86) + 'Z" fill="' + hair + '"/>';
    if (st === 'cap') {
      g += '<path d="M' + X(60) + ' ' + Y(76) + ' C' + X(60) + ' ' + Y(44) + ' ' + X(140) + ' ' + Y(44) + ' ' + X(140) + ' ' + Y(76) + 'Z" fill="' + (shirt || '#1f2a44') + '"/>' +
        '<rect x="' + X(92) + '" y="' + Y(70) + '" width="' + R(66) + '" height="' + R(10) + '" rx="' + R(5) + '" fill="' + (shirt || '#1f2a44') + '"/>';
    } else if (st === 'bald') {
      g += '<path d="M' + X(60) + ' ' + Y(92) + ' C' + X(60) + ' ' + Y(76) + ' ' + X(66) + ' ' + Y(70) + ' ' + X(70) + ' ' + Y(70) + ' L' + X(70) + ' ' + Y(92) + 'Z M' + X(140) + ' ' + Y(92) + ' C' + X(140) + ' ' + Y(76) + ' ' + X(134) + ' ' + Y(70) + ' ' + X(130) + ' ' + Y(70) + ' L' + X(130) + ' ' + Y(92) + 'Z" fill="' + hair + '"/>';
    } else {
      g += hairTop;
      if (st === 'bun' || st === 'gray') g += '<circle cx="' + X(100) + '" cy="' + Y(42) + '" r="' + R(17) + '" fill="' + hair + '"/>';
      if (st === 'curly') {
        [[66, 62], [84, 48], [104, 44], [124, 50], [138, 66]].forEach(function (p) {
          g += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="' + R(13) + '" fill="' + hair + '"/>';
        });
      }
    }
    g += '<circle cx="' + X(86) + '" cy="' + Y(92) + '" r="' + R(4.2) + '" fill="#1f2a44"/><circle cx="' + X(114) + '" cy="' + Y(92) + '" r="' + R(4.2) + '" fill="#1f2a44"/>';
    g += '<path d="M' + X(90) + ' ' + Y(108) + ' Q' + X(100) + ' ' + Y(115) + ' ' + X(110) + ' ' + Y(108) + '" fill="none" stroke="#1f2a44" stroke-width="' + R(3.2) + '" stroke-linecap="round"/>';
    return g;
  }

  function radarLogo() {
    return '<svg class="radar" viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle cx="60" cy="60" r="56" fill="none" stroke="#2c3f6b" stroke-width="2"/><circle cx="60" cy="60" r="38" fill="none" stroke="#2c3f6b" stroke-width="2"/>' +
      '<circle cx="60" cy="60" r="20" fill="none" stroke="#2c3f6b" stroke-width="2"/><path d="M60 60 L60 4 A56 56 0 0 1 108.5 32 Z" fill="#f2b134" opacity=".85"/>' +
      '<circle cx="60" cy="60" r="5" fill="#f2b134"/><circle cx="84" cy="30" r="5" fill="#c0392b"/></svg>';
  }

  function helpLines() {
    return C.help.map(function (h) {
      var num = h.name.replace(/^(Línea|Chat)\s*/, '');
      var badge = /^\d+$/.test(num) ? num : 'Chat<br>100';
      if (h.name === 'Chat 100') badge = 'Chat<br>100';
      return '<a class="help-line" href="' + esc(h.href) + '"' + (h.href.indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<span class="num">' + badge + '</span><span><b>' + esc(h.name) + '</b><span>' + esc(h.desc) + '</span></span></a>';
    }).join('');
  }

  /* ---------- title ---------- */

  function nextGirlName() {
    if (!S.game) return null;
    if (S.run) return S.run.girl;
    if (!S.fb && E.chainOver(S.game, C)) return null;
    return E.girlOf(C, S.game.profile, S.game.gen).name;
  }

  function renderTitle() {
    S.screen = 'title';
    var name = nextGirlName();
    show('<div class="screen night">' +
      '<div class="title-hero">' + radarLogo() + '<div class="logo">RADAR</div><div class="logo-sub">GENERACIONES</div>' +
      '<p class="lead">Un año en la vida de una chica. Cuatro cosas que mantener en equilibrio. Y mensajes que no son lo que parecen.</p></div>' +
      (name ? '<button class="btn" data-act="continue" data-focus>Seguir con ' + esc(name) + '</button>' : '') +
      (S.game && !name && E.chainOver(S.game, C) ? '<button class="btn" data-act="chain-end" data-focus>Ver el cierre de la historia</button>' : '') +
      '<button class="btn ' + (name ? 'quiet' : '') + '" data-act="new"' + (name ? '' : ' data-focus') + '>Nueva historia</button>' +
      (S.game ? '<button class="btn quiet" data-act="memories">Recuerdos</button>' : '') +
      '<button class="btn quiet" data-act="help">Ayuda</button>' +
      '<div class="note small"><b>Antes de jugar.</b> Este juego trata de ofertas engañosas y de cómo captan a chicas por internet. No muestra violencia: cada historia se detiene antes del daño. Las personas y los casos son inventados. Si algo de esto te pasó, no es tu culpa y puedes pedir ayuda en la sección Ayuda.</div>' +
      '</div>');
  }

  /* ---------- profile picker ---------- */

  function renderPick() {
    S.screen = 'pick';
    var html = '<div class="screen night"><button class="back" data-act="title">' + GLYPH.left + ' Volver</button>' +
      '<h1 style="margin-top:10px">¿Con quién empiezas?</h1>' +
      '<p class="lead muted">Cuando su año termine, la historia sigue con alguien de su familia o de su barrio, que recuerda lo que le pasó.</p>';
    var opened = unlocksGet();
    Object.keys(C.profiles).forEach(function (id, i) {
      var p = C.profiles[id], g = p.girls[0];
      if (p.locked && !opened[p.locked]) {
        html += '<div class="pick locked"><div class="pick-head">' + portrait(g) + '<div><div class="pick-name">? ? ?</div>' +
          '<div class="small muted">' + esc(p.place) + '</div><span class="pick-tag">Nueva</span></div></div>' +
          '<p>Se abre cuando termines el primer año de cualquier historia.</p></div>';
        return;
      }
      html += '<button class="pick" data-act="pick" data-id="' + id + '"' + (i === 0 ? ' data-focus' : '') + '>' +
        '<div class="pick-head">' + portrait(g) + '<div><div class="pick-name">' + esc(g.name) + ', ' + g.age + '</div>' +
        '<div class="small muted">' + esc(p.place) + '</div><span class="pick-tag">' + esc(p.tag) + '</span></div></div>' +
        '<p>' + esc(p.blurb) + '</p><div class="mini-bars">' +
        C.bars.map(function (b) { return '<div class="mini-bar">' + esc(b.name) + '<span><i style="width:' + p.start[b.id] + '%"></i></span></div>'; }).join('') +
        '</div></button>';
    });
    show(html + '</div>');
  }

  /* ---------- the table ---------- */

  function renderGame(deltas) {
    S.screen = 'game';
    var run = S.run;
    var v = E.view(run, C);
    if (!v) return finishRun();
    var who = v.who || {};
    var bars = C.bars.map(function (b) {
      var val = v.bars[b.id];
      var cls = 'bar' + (val <= 15 || val >= 85 ? ' danger' : '') + (deltas && deltas[b.id] > 0 ? ' up' : '') + (deltas && deltas[b.id] < 0 ? ' down' : '');
      return '<div class="' + cls + '" data-bar="' + b.id + '"><div class="dot-slot"><span class="dot"></span></div>' + barIcon(b.id, val) +
        '<div class="name">' + esc(b.name) + '</div><span class="sr-only">' + esc(b.name) + ': ' + Math.round(val) + ' de 100</span></div>';
    }).join('');

    var whoLabel = v.kind === 'intro' ? '' : v.chat ? 'Mensaje nuevo' : (who.name || '');
    var fr = v.frame || { id: 'daily' };
    var scene = (v.newBy && fr.id !== 'branch' ? '<div class="new-tag">Nuevo · ' + (v.newBy === 'el tiempo' ? 'llegó con el tiempo' : 'lo abrió ' + esc(v.newBy)) + '</div>' : '') +
      (v.title ? '<div class="end-title">' + esc(v.title) + '</div>' : '') +
      (whoLabel && !v.title ? '<div class="who">' + esc(whoLabel) + '</div>' : '') + '<div>' + esc(v.text) + '</div>' +
      (v.deeds && v.deeds.length ? '<div class="deeds-now"><b>Hazañas de este año</b>' + v.deeds.map(function (d) {
        return '<div class="deed-mini"><span class="dl">' + esc(d.letter) + '</span><span><b>' + esc(d.name) + '</b><small>' + esc(d.hint) + '</small></span></div>';
      }).join('') + '</div>' : '');

    var face;
    if (v.chat) {
      var ch = CHANNELS[v.chat.channel] || CHANNELS.whatsapp;
      face = '<div class="chat"><div class="chat-head" style="background:' + ch.color + '"><span class="av">' + portrait(who) + '</span>' +
        '<span>' + esc(v.chat.name) + '</span><span class="ch">' + esc(ch.label) + '</span></div><div class="chat-body">' +
        v.chat.lines.map(function (ln) {
          if (ln.sys) return '<div class="bubble sys">' + esc(ln.t) + '</div>';
          var sig = ln.marked ? C.signals[ln.signal] : null;
          return '<div class="bubble' + (sig ? ' marked' : '') + '">' + esc(ln.t) +
            (sig ? '<div class="sig">' + GLYPH.flag + esc(sig.label) + '</div>' : '') + '</div>';
        }).join('') + '</div></div>';
    } else {
      face = '<div class="face">' + portrait(who) + '</div>';
    }
    var plate = v.chat ? '' : '<div class="nameplate">' + esc(who.name || '') + (who.age ? '<small>' + who.age + ' años</small>' : '') + '</div>';
    // A band at the top of the card says what kind of card it is.
    var band = '';
    if (fr.id === 'thread') band = '<div class="band t-' + fr.thread + '">' + threadIcon(fr.thread) + '<span>' + esc(fr.label) + ' · ' + fr.step + ' de ' + fr.steps + '</span>' + pips(fr.step, fr.steps) + '</div>';
    else if (fr.id === 'branch') band = '<div class="band branch">' + GLYPH.flag + '<span>' + (fr.by && fr.by !== 'el tiempo' ? 'Rama abierta por ' + esc(fr.by) : 'Rama nueva') +
      (fr.steps ? ' · ' + fr.step + ' de ' + fr.steps : '') + '</span>' + (fr.steps ? pips(fr.step, fr.steps) : '') + '</div>';
    else if (fr.id === 'memory') band = '<div class="band memory"><span>' + esc(run.girl) + ' recuerda' + (fr.of ? ' a ' + esc(fr.of) : '') + '</span></div>';

    var threads = (v.threads || []).map(function (t) {
      return '<span class="thr t-' + t.id + (t.closed ? ' closed' : '') + '" title="' + esc(t.name) + '">' + threadIcon(t.id) + pips(t.at, t.steps) + '</span>';
    }).join('');
    var toast = v.toast && v.toast.length ? '<div class="toast" role="status">' + v.toast.map(function (d) {
      return '<span><span class="dl">' + esc(d.letter) + '</span><b>Hazaña: ' + esc(d.name) + '</b></span>';
    }).join('') + '</div>' : '';

    var choices = v.same
      ? '<button class="one" data-side="R" data-focus>' + esc(v.R.l) + '</button>'
      : '<button class="L" data-side="L" data-focus>' + GLYPH.left + '<span>' + esc(v.L.l) + '</span></button>' +
        '<button class="R" data-side="R"><span>' + esc(v.R.l) + '</span>' + GLYPH.right + '</button>';

    show('<div class="top"><div class="bars" role="group" aria-label="Tu vida">' + bars + '</div>' +
      '<div class="year"><span>' + esc(v.month) + '</span>' + yearLine(v.week, v.acts, v.offers) + '<span class="act-name">' + esc(v.act.name) + '</span></div></div>' +
      '<div class="table"><div class="scene">' + toast + scene + '</div>' +
      '<div class="stack"><div class="under"></div><div class="card enter f-' + fr.id + (v.ending ? ' end-card' : '') + '" id="card" role="group" aria-label="Carta. Desliza o usa los botones.">' +
      band + face + plate +
      '<div class="choice L">' + esc(v.L.l) + '</div><div class="choice R">' + esc(v.R.l) + '</div></div></div>' +
      '<div class="choices">' + choices + '</div>' +
      '<div class="status"><span>' + esc(run.girl) + ' · Semana ' + v.week + '</span>' +
      (threads ? '<button class="threads" data-act="menu" aria-label="Tus historias de este año">' + threads + '</button>' : '') +
      (v.radarOn ? '<span class="radar-on">' + GLYPH.flag + 'Radar</span>' : '') +
      '<button class="menu-btn" data-act="menu" aria-label="Menú">Menú</button></div></div>', 'act-' + v.act.i);

    if (deltas) setTimeout(function () {
      Array.prototype.forEach.call(app.querySelectorAll('.bar.up, .bar.down'), function (el) { el.classList.remove('up', 'down'); });
    }, 1100);
    hoverSide = null;
    bindCard();
  }

  function setPreview(side) {
    var p = side ? E.preview(S.run, C, side) : {};
    Array.prototype.forEach.call(app.querySelectorAll('.bar'), function (el) {
      var dot = el.querySelector('.dot');
      var k = p[el.getAttribute('data-bar')];
      dot.className = 'dot' + (k ? ' ' + k : '');
      el.classList.toggle('hl', !!k);
    });
  }
  function setOverlay(side) {
    Array.prototype.forEach.call(app.querySelectorAll('.card .choice'), function (el) {
      el.classList.toggle('show', !!side && el.classList.contains(side));
    });
  }

  function bindCard() {
    var card = document.getElementById('card');
    if (!card) return;
    var same = E.view(S.run, C).same;
    var startX = null, dx = 0, pid = null;
    card.addEventListener('pointerdown', function (e) {
      if (S.busy) return;
      startX = e.clientX; dx = 0; pid = e.pointerId;
      card.setPointerCapture(pid);
      card.classList.add('dragging');
    });
    card.addEventListener('pointermove', function (e) {
      if (startX == null) return;
      dx = e.clientX - startX;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
      var side = Math.abs(dx) > 16 ? (dx < 0 ? 'L' : 'R') : null;
      if (!same) setOverlay(side);
      setPreview(side);
    });
    function end() {
      if (startX == null) return;
      card.classList.remove('dragging');
      var w = card.offsetWidth || 300;
      var side = dx < 0 ? 'L' : 'R';
      startX = null;
      if (Math.abs(dx) > w * COMMIT) { commit(side); return; }
      card.style.transform = '';
      setOverlay(null); setPreview(null);
    }
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  function commit(side) {
    if (S.busy || !S.run) return;
    S.busy = true;
    var card = document.getElementById('card');
    var v = E.view(S.run, C);
    if (v.same) side = 'R';
    if (card) { card.style.transform = ''; card.classList.add('fly-' + side); }
    setOverlay(null);
    setTimeout(function () {
      var before = Object.assign({}, S.run.bars);
      E.choose(S.run, C, side);
      var deltas = {};
      E.BAR_IDS.forEach(function (b) { deltas[b] = S.run.bars[b] - before[b]; });
      save();
      S.busy = false;
      if (S.run.done) finishRun();
      else renderGame(deltas);
    }, 230);
  }

  function finishRun() {
    S.fb = E.feedback(S.run, C);
    E.commitRun(S.game, S.run, C);
    unlocksSet('first');
    S.run = null;
    save();
    renderFeedback();
  }

  /* ---------- feedback: Tu ruta RADAR ---------- */

  function attemptHtml(a, moments) {
    var segs = moments.map(function (m, i) {
      var cls = 'seg';
      if (a.met) cls += ' met';
      else if (a.cutAt != null) cls += i < a.cutAt ? ' on' : i === a.cutAt ? ' cut' : '';
      else if (i <= a.reached) cls += ' on';
      return '<span class="' + cls + '"></span>';
    }).join('');
    var here = a.met ? moments.length - 1 : a.cutAt != null ? a.cutAt : a.reached;
    var labels = moments.map(function (m, i) { return '<span' + (i === here ? ' class="here"' : '') + '>' + esc(m) + '</span>'; }).join('');
    var outcome;
    if (a.met) outcome = '<p class="outcome met">Llegó hasta el encuentro. Ahí paramos la historia.</p>';
    else if (a.cutAt != null) outcome = '<p class="outcome cut">Cortó en «' + esc(moments[a.cutAt]) + '»' + (a.withSomeone ? ', después de contarlo' : '') + '.</p>';
    else if (a.reached < 0) outcome = '<p class="outcome">La oferta todavía no había llegado.</p>';
    else outcome = '<p class="outcome">El año terminó con la conversación abierta.</p>';
    var chips = [];
    if (a.withSomeone) chips.push('<span class="chip good">Lo habló con alguien mientras pasaba</span>');
    else if (a.cutAt != null || a.met) chips.push('<span class="chip warn">Lo decidió sola</span>');
    if (a.capture) chips.push('<span class="chip good">Guardó capturas</span>');
    if (a.report) chips.push('<span class="chip good">Reportó la cuenta</span>');
    if (a.toldAfter) chips.push('<span class="chip good">Lo contó después</span>');
    if (a.warned) chips.push('<span class="chip good">Avisó a otra chica</span>');
    var ch = CHANNELS[a.channel] || {};
    var sigs = a.signals.length ? '<h4>Señales que aparecieron</h4>' + a.signals.map(function (s) {
      return '<div class="sig-row"><span class="mk ' + (s.caught ? 'ok' : 'miss') + '">' + (s.caught ? GLYPH.ok : GLYPH.miss) + '</span>' +
        '<span><b>' + esc(s.label) + '</b><span class="fn">' + esc(s.fn) + (s.caught ? ' · la notaste' : ' · se pasó') + '</span><br>' + esc(s.why) + '</span></div>';
    }).join('') : '';
    return '<div class="attempt"><div class="ch">' + esc(ch.label || a.channel) + '</div><h3>' + esc(a.title) + '</h3>' +
      '<div class="journey">' + segs + '</div><div class="journey-labels">' + labels + '</div>' + outcome +
      (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + sigs +
      '<h4>Otras salidas que tenía</h4><ul class="exits">' + a.exits.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  }

  function barsLine(bars) {
    var off = bars.filter(function (b) { return b.state !== 'media'; });
    if (!off.length) return 'Las cuatro quedaron cerca de la mitad: es el equilibrio más seguro.';
    return off.map(function (b) { return b.name + (b.state === 'alta' ? ' quedó muy alta' : ' quedó muy baja'); }).join(', ') +
      '. Lo más seguro es acercarlas a la mitad: ver «Las cuatro barras» en Ayuda.';
  }

  function renderFeedback() {
    S.screen = 'feedback';
    var fb = S.fb;
    if (!fb) return renderTitle();
    var cause = '';
    if (fb.type === 'bar') {
      var b = barName(fb.bar);
      cause = '<p class="lead">Se rompió el equilibrio en <b>' + esc(b.name) + '</b>: ' + esc(fb.side === 'low' ? b.low : b.high).toLowerCase() + '.</p>';
    }
    if (fb.type === 'story') cause = '<p class="lead">Este año no terminó por una barra: lo terminó la historia de las ofertas.</p>';
    var lit = fb.letters.filter(function (l) { return l.lit; }).length;
    var html = '<div class="screen night"><div class="fb-head"><div class="eyebrow">Tu ruta RADAR</div>' +
      '<h1 tabindex="-1" data-focus>' + esc(fb.title) + '</h1><div class="weeks">' + esc(fb.girl) + ' · ' + fb.weeks + ' de 40 semanas</div>' +
      (fb.acts ? yearLine(fb.weeks, fb.acts, fb.offers, 'big') + '<div class="yl-acts">' + fb.acts.map(function (a) { return '<span>' + esc(a.name) + '</span>'; }).join('') + '</div>' : '') +
      (fb.threads && fb.threads.length ? '<div class="fb-threads">' + fb.threads.map(function (t) {
        return '<span class="thr t-' + t.id + (t.closed ? ' closed' : '') + '">' + threadIcon(t.id) + '<b>' + esc(t.name) + '</b>' + pips(t.at, t.steps) + '</span>';
      }).join('') + '</div>' : '') +
      (fb.threads && fb.threads.some(function (t) { return t.line; }) || (fb.branchLines || []).length ? '<ul class="fb-lines">' + fb.threads.filter(function (t) { return t.line; }).map(function (t) {
        return '<li class="t-' + t.id + '">' + esc(t.line) + '</li>';
      }).join('') + (fb.branchLines || []).map(function (l) { return '<li class="t-branch">' + esc(l) + '</li>'; }).join('') + '</ul>' : '') + '</div>' +
      cause + '<div class="fb-msg">' + esc(fb.message) + '</div>' +
      (fb.chainBroken ? '<div class="fb-msg chain"><b>La cuenta cayó.</b> Las capturas y los reportes de varias chicas, una tras otra, sirvieron para que la den de baja.</div>' : '') +
      (fb.bars ? '<h2>Cómo quedaron sus barras</h2><div class="fb-bars">' + fb.bars.map(function (b) {
        return '<div class="fb-bar ' + b.state + '"><span>' + esc(b.name) + '</span><i><b style="width:' + b.value + '%"></b></i><small>' + (b.state === 'alta' ? 'muy alta' : b.state === 'baja' ? 'muy baja' : 'en equilibrio') + '</small></div>';
      }).join('') + '</div><p class="small muted">' + esc(barsLine(fb.bars)) + '</p>' : '') +
      '<h2>Los intentos de este año</h2>' +
      (fb.attempts.length ? fb.attempts.map(function (a) { return attemptHtml(a, fb.moments); }).join('') : '<p class="muted">Este año no llegó a aparecer ninguna oferta.</p>') +
      (fb.deeds && fb.deeds.length ? '<h2>Hazañas de este año</h2>' + fb.deeds.map(function (d) {
        return '<div class="deed-row done"><span class="dl">' + esc(d.letter) + '</span><span><b>' + esc(d.name) + '</b><small>Abre: ' + esc(d.opens) + '</small></span></div>';
      }).join('') : '') +
      '<h2>Lo que hizo, letra por letra</h2><div class="letters">' +
      fb.letters.map(function (l) {
        return '<div class="letter' + (l.lit ? ' lit' : '') + '"><div class="lt">' + LETTER_GLYPH[l.id] + '</div><div class="ln">' + esc(l.name) + '</div></div>';
      }).join('') + '</div><p class="small muted" style="margin-top:8px">' + lit + ' de 5 letras encendidas este año.</p>' +
      '<ul class="letter-tips">' + fb.letters.map(function (l) {
        return '<li class="' + (l.lit ? 'done' : '') + '"><b>' + esc(l.name) + '.</b> ' + esc(l.q) + ' ' + (l.lit ? 'Lo hizo este año.' : esc(l.tip)) + '</li>';
      }).join('') + '</ul>' +
      '<h2>Si algo así te pasa de verdad</h2>' + helpLines() +
      (fb.last ? '<button class="btn" data-act="chain-end" style="margin-top:24px">Cerrar la historia</button>'
        : '<button class="btn" data-act="next" style="margin-top:24px">Sigue la historia de ' + esc(fb.next.name) + '</button>') +
      '<button class="btn quiet" data-act="memories">Recuerdos</button>' +
      '<button class="btn quiet" data-act="title">Volver al inicio</button></div>';
    show(html);
    app.querySelector('.screen').scrollTop = 0;
  }

  /* ---------- the story passes on ---------- */

  function renderPassing() {
    S.screen = 'passing';
    var g = E.girlOf(C, S.game.profile, S.game.gen);
    var last = S.game.history[S.game.history.length - 1];
    show('<div class="passing">' + portrait(g) + '<div class="eyebrow">Generación ' + (S.game.gen + 1) + '</div>' +
      '<h1>' + esc(g.name) + '</h1>' +
      '<p>' + (last ? esc(g.name) + ' es ' + esc(g.rel.replace(/^su /, '')) + ' de ' + esc(last.girl) + '. Lo que vivió ' + esc(last.girl) + ' ahora es parte de lo que ella sabe.' : '') + '</p>' +
      inheritance(last) +
      (S.game.chainBroken ? '<p class="small muted">La cuenta que les escribía ya no existe. Pero hay otras.</p>' : '') +
      '<button class="btn" data-act="start" data-focus style="max-width:320px">Empezar su año</button></div>');
  }

  // What the girl who just finished leaves to the next one: the branches her
  // deeds opened and what she can tell her.
  function inheritance(last) {
    if (!last) return '';
    var now = E.nextBranch(S.game, C);
    var items = (C.deeds || []).filter(function (d) { return S.game.deeds[d.id] === last.girl; }).map(function (d) {
      return '<li><span class="dl">' + esc(LETTER_GLYPH[d.letter] || '') + '</span><span><b>' + esc(d.name) + '</b><small>' +
        (d.id === now ? 'Este año: ' : 'Más adelante: ') + esc(d.opens) + '</small></span></li>';
    });
    var told = last.arcs.filter(function (a) { return a.cut || a.toldAfter; }).length;
    if (told) items.push('<li><span class="dl">R</span><span><b>Lo que le contó</b><small>' + told + (told === 1 ? ' oferta que' : ' ofertas que') + ' ' + esc(last.girl) + ' cortó o contó. Su radar empieza más alto.</small></span></li>');
    if (!items.length) return '';
    return '<div class="inherit"><div class="eyebrow">Lo que abrió ' + esc(last.girl) + '</div><ul>' + items.join('') + '</ul></div>';
  }

  /* ---------- the end of the chain (after the fourth girl) ---------- */

  function renderChainEnd() {
    S.screen = 'chain';
    var g = S.game, col = E.collection(g, C), p = C.profiles[g.profile];
    var names = g.history.map(function (h) { return h.girl; });
    var girls = g.history.map(function (h) {
      var deeds = (C.deeds || []).filter(function (d) { return g.deeds[d.id] === h.girl; }).map(function (d) { return d.name; });
      return '<li><span class="n">' + (h.gen + 1) + '</span><span><b>' + esc(h.girl) + '</b> · ' + esc(h.title || 'Diciembre') + ' · semana ' + h.weeks +
        (deeds.length ? '<small>Hazañas: ' + esc(deeds.join(', ')) + '</small>' : '') + '</span></li>';
    }).join('');
    show('<div class="screen night"><div class="fb-head"><div class="eyebrow">Fin de la historia</div>' +
      '<h1 tabindex="-1" data-focus>' + esc(names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1]) + '</h1>' +
      '<div class="weeks">' + esc(p.place) + ' · ' + names.length + ' años</div></div>' +
      (g.chainBroken ? '<div class="fb-msg chain"><b>La cuenta cayó.</b> Entre varias chicas juntaron las pruebas y los reportes para que la den de baja.</div>' : '') +
      '<h2>Lo que lograron entre todas</h2><ul class="routes">' +
      '<li><b>Hazañas</b> · ' + col.deeds.got + ' de ' + col.deeds.total + '</li>' +
      '<li><b>Ramas cerradas</b> · ' + col.branches.got + ' de ' + col.branches.total + '</li>' +
      '<li><b>Señales que reconocieron</b> · ' + col.signals.got + ' de ' + col.signals.total + '</li>' +
      '<li><b>Ofertas cortadas a tiempo</b> · ' + col.routes.got + ' de ' + col.routes.total + '</li>' +
      '<li><b>Personas de su red</b> · ' + col.people.got + ' de ' + col.people.total + '</li></ul>' +
      '<h2>Las chicas</h2><ul class="gen-list">' + girls + '</ul>' +
      '<p class="small muted" style="margin-top:14px">Una historia nueva empieza con otras chicas, otras ofertas y las ramas que esta no llegó a vivir.</p>' +
      '<button class="btn" data-act="new" style="margin-top:20px">Nueva historia</button>' +
      '<button class="btn quiet" data-act="memories">Recuerdos</button>' +
      '<button class="btn quiet" data-act="title">Volver al inicio</button></div>');
  }

  /* ---------- memories ---------- */

  // The collection: what the network learned. It never shows endings to
  // collect (reports/Desbloqueos en Reigns.md): signals recognised, people,
  // offers cut in time and the deeds, each with «x de y».
  function renderMemories() {
    S.screen = 'memories';
    if (!S.game) return renderTitle();
    var col = E.collection(S.game, C);
    var deeds = col.deeds.list.map(function (d) {
      return '<div class="deed-row' + (d.by ? ' done' : '') + '"><span class="dl">' + esc(d.letter) + '</span><span><b>' + esc(d.name) + '</b>' +
        '<small>' + (d.by ? 'Lo hizo ' + esc(d.by) + '. ' : esc(d.hint) + ' ') + '<i>Abre: ' + esc(d.opens) + '</i></small></span></div>';
    }).join('');
    var fns = col.signals.byFn.filter(function (f) { return f.got.length || f.missing; }).map(function (f) {
      return '<div class="fn-box"><b>' + esc(f.fn) + '</b><span class="small muted">' + f.got.length + ' de ' + (f.got.length + f.missing) + '</span>' +
        f.got.map(function (g) { return '<div class="sig-got">' + GLYPH.ok + '<span>' + esc(g.label) + '<small>' + esc(g.why) + ' La notó ' + esc(g.by) + '.</small></span></div>'; }).join('') +
        (f.missing ? '<div class="small muted">' + f.missing + ' por notar en esta función</div>' : '') + '</div>';
    }).join('');
    var routes = col.routes.list.map(function (r) {
      return '<li><b>' + esc(r.open ? r.title : 'Oferta por llegar') + '</b> · ' + (r.cutAt ? 'Cortada en «' + esc(r.cutAt) + '» por ' + esc(r.by) : r.open ? 'Todavía nadie la cortó' : 'Se abre más adelante') + '</li>';
    }).join('');
    var gens = S.game.history.map(function (h, i) {
      var title = h.end.type === 'meet' ? 'Aquí paramos: ' + C.arcs[h.end.arc].title : h.title || (h.end.type === 'win' ? 'Diciembre' : E.getCard(C, null, 'end_' + h.end.bar + '_' + h.end.side).title);
      return '<li><span class="n">' + (i + 1) + '</span><span><b>' + esc(h.girl) + '</b> · ' + esc(title) + ' · semana ' + h.weeks + '</span></li>';
    }).join('');
    show('<div class="screen night"><button class="back" data-act="back" data-focus>' + GLYPH.left + ' Volver</button>' +
      '<h1 style="margin-top:10px">Recuerdos</h1><p class="lead muted">Lo que fueron aprendiendo las chicas de esta historia.</p>' +
      '<h2>Hazañas · ' + col.deeds.got + ' de ' + col.deeds.total + '</h2>' + deeds +
      '<h2>Ramas cerradas · ' + col.branches.got + ' de ' + col.branches.total + '</h2><ul class="routes">' + col.branches.list.map(function (b) {
        return '<li><b>' + esc(b.open || b.by ? b.name : 'Rama por abrir') + '</b> · ' + (b.by ? 'La cerró ' + esc(b.by) : b.open ? 'Abierta, todavía sin cerrar' : 'Se abre con una hazaña') + '</li>';
      }).join('') + '</ul>' +
      '<h2>Señales que reconocieron · ' + col.signals.got + ' de ' + col.signals.total + '</h2><p class="small muted">Agrupadas en las ocho funciones: lo que busca cada mensaje.</p>' + fns +
      '<h2>Personas de su red · ' + col.people.got + ' de ' + col.people.total + '</h2><p class="small">' + (col.people.names.length ? esc(col.people.names.join(', ')) : 'Todavía nadie.') + '</p>' +
      '<h2>Ofertas cortadas a tiempo · ' + col.routes.got + ' de ' + col.routes.total + '</h2><ul class="routes">' + routes + '</ul>' +
      (gens ? '<h2>Las chicas</h2><ul class="gen-list">' + gens + '</ul>' : '') + '</div>');
  }

  /* ---------- guide to the four bars (shown once after the first year,
   * and from Ayuda) ---------- */

  function renderBarsGuide(after) {
    S.screen = 'bars';
    S.guideAfter = after;
    unlocksSet('barsGuide');
    show('<div class="screen night">' + (after === 'passing' ? '' : '<button class="back" data-act="back" data-focus>' + GLYPH.left + ' Volver</button>') +
      '<h1 style="margin-top:10px">Las cuatro barras</h1>' +
      '<p class="lead">Lo más seguro no es tener todo al máximo: es mantener las cuatro cerca de la mitad. Las dos puntas son peligrosas, porque quien engaña busca justo el hueco que dejan.</p>' +
      C.bars.map(function (b) {
        return '<div class="guide-bar"><div class="gb-head">' + barIcon(b.id, 50) + '<b>' + esc(b.name) + '</b></div>' +
          '<p>' + esc(b.about) + '</p>' +
          '<div class="gb-ends"><span><i>En cero · ' + esc(b.low) + '</i>' + esc(b.lowWhy) + '</span><span><i>Al máximo · ' + esc(b.high) + '</i>' + esc(b.highWhy) + '</span></div>' +
          '<p class="gb-bal"><b>En equilibrio:</b> ' + esc(b.balance) + '</p></div>';
      }).join('') +
      '<p class="small muted" style="margin-top:12px">Al arrastrar una carta, las flechas sobre las barras te dicen cuáles suben y cuáles bajan. Si una barra está muy alta o muy baja, busca la opción que la acerque a la mitad.</p>' +
      (after === 'passing' ? '<button class="btn" data-act="guide-done" data-focus style="margin-top:18px">Seguir la historia</button>' : '') + '</div>');
  }

  /* ---------- help ---------- */

  function renderHelp() {
    S.screen = 'help';
    show('<div class="screen night"><button class="back" data-act="back" data-focus>' + GLYPH.left + ' Volver</button>' +
      '<h1 style="margin-top:10px">Ayuda</h1>' +
      '<h2>Cómo se juega</h2><ul class="steps">' +
      '<li>Desliza la carta a la izquierda o a la derecha, o toca un botón. Al arrastrar, una flecha sobre cada barra te dice si va a subir o a bajar. Una flecha grande es un cambio grande.</li>' +
      '<li>Si una barra se vacía o se llena del todo, el año termina. Las dos puntas son peligrosas: sin familia y bajo control, sola y arrastrada, sin plata y con plata que amarra, sin sueños y desesperada por irse.</li>' +
      '<li>Cuando te escribe alguien que no conoces, la conversación aparece dentro de la carta. Si tu radar se enciende, verás marcadas las señales.</li>' +
      '<li>Contarle a alguien no termina la conversación, pero te acompaña. Cortar sí la termina.</li></ul>' +
      '<button class="btn quiet" data-act="bars-guide">Las cuatro barras y cómo mantener el equilibrio</button>' +
      '<h2>Si algo te pasa ahora</h2><ul class="steps">' +
      '<li><b>No borres el chat.</b> Toma capturas de los mensajes y del perfil.</li>' +
      '<li><b>Bloquea y reporta la cuenta</b> en la misma app.</li>' +
      '<li><b>Cuéntale a alguien de confianza:</b> tu mamá, una tía, una prima, una profe o una amiga mayor.</li></ul>' +
      '<h2>Líneas gratuitas</h2>' + helpLines() +
      '<h2>Para el equipo</h2><p class="small muted">El progreso se guarda solo en este celular. No se recoge ningún dato. Versión 0.4.</p>' +
      '<button class="btn quiet small" data-act="reset">Borrar el progreso en este celular</button></div>');
  }

  function openMenu() {
    S.back = 'game';
    var v = E.view(S.run, C);
    var thr = (v.threads || []).map(function (t) {
      return '<div class="menu-thr t-' + t.id + (t.closed ? ' closed' : '') + '">' + threadIcon(t.id) + '<span><b>' + esc(t.name) + '</b><small>' +
        (t.at === 0 ? 'Todavía no empieza' : t.closed ? 'Cerrada este año' : 'Paso ' + t.at + ' de ' + t.steps) + '</small></span>' + pips(t.at, t.steps) + '</div>';
    }).join('');
    var html = '<div class="screen night"><h1>Pausa</h1><p class="lead muted">' + esc(S.run.girl) + ', semana ' + Math.min(S.run.week, 40) + ' · ' + esc(v.act.name) + '.</p>' +
      (thr ? '<h2>Sus historias de este año</h2>' + thr : '') +
      '<button class="btn" data-act="resume" data-focus>Seguir jugando</button>' +
      '<button class="btn quiet" data-act="memories">Recuerdos</button><button class="btn quiet" data-act="help">Ayuda</button>' +
      '<button class="btn quiet" data-act="title">Volver al inicio</button></div>';
    S.screen = 'menu';
    show(html);
  }

  /* ---------- events ---------- */

  app.addEventListener('click', function (e) {
    var sideBtn = e.target.closest('[data-side]');
    if (sideBtn && S.screen === 'game') { commit(sideBtn.getAttribute('data-side')); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'continue') {
      if (S.run) renderGame();
      else if (S.fb) renderFeedback();
      else if (E.chainOver(S.game, C)) renderChainEnd();
      else renderPassing();
    } else if (act === 'chain-end') {
      S.fb = null; save(); renderChainEnd();
    } else if (act === 'new') {
      if (S.game && !window.confirm('Vas a empezar una historia nueva. Se borra la que tienes. ¿Seguimos?')) return;
      wipe(); renderPick();
    } else if (act === 'pick') {
      S.game = E.newGame(C, el.getAttribute('data-id'));
      S.run = E.newRun(S.game, C);
      S.fb = null;
      save(); renderGame();
    } else if (act === 'next') {
      if (!unlocksGet().barsGuide) renderBarsGuide('passing'); else renderPassing();
    } else if (act === 'guide-done') {
      renderPassing();
    } else if (act === 'bars-guide') {
      S.back = 'help'; renderBarsGuide('help');
    } else if (act === 'start') {
      S.run = E.newRun(S.game, C);
      S.fb = null;
      save(); renderGame();
    } else if (act === 'memories') {
      S.back = S.screen === 'menu' ? 'menu' : S.screen; renderMemories();
    } else if (act === 'help') {
      S.back = S.screen === 'menu' ? 'menu' : S.screen; S.helpBack = S.back; renderHelp();
    } else if (act === 'back') {
      if (S.screen === 'bars' && S.guideAfter === 'help') { S.back = S.helpBack || 'title'; renderHelp(); return; }
      if (S.back === 'feedback' && S.fb) renderFeedback();
      else if (S.back === 'chain' && S.game) renderChainEnd();
      else if (S.back === 'menu' && S.run) openMenu();
      else renderTitle();
    } else if (act === 'title') {
      renderTitle();
    } else if (act === 'menu') {
      openMenu();
    } else if (act === 'resume') {
      renderGame();
    } else if (act === 'reset') {
      if (window.confirm('¿Borrar todo el progreso en este celular?')) { wipe(); renderTitle(); }
    }
  });

  // Mouse hover previews a choice: over a button, or over the left or right
  // half of the card. The bars it would move get a dot and light up.
  var hoverSide = null;
  function hover(side) {
    if (side === hoverSide) return;
    hoverSide = side;
    var same = S.run && E.view(S.run, C).same;
    setPreview(same ? null : side);
    setOverlay(same ? null : side);
    Array.prototype.forEach.call(app.querySelectorAll('.choices [data-side]'), function (b) {
      b.classList.toggle('hover', !!side && b.getAttribute('data-side') === side);
    });
  }
  app.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse' || S.screen !== 'game' || S.busy || !S.run) return;
    var card = document.getElementById('card');
    if (card && card.classList.contains('dragging')) return;
    var b = e.target.closest('[data-side]');
    var side = b ? b.getAttribute('data-side') : null;
    if (!side && card && card.contains(e.target)) {
      var r = card.getBoundingClientRect();
      side = e.clientX < r.left + r.width / 2 ? 'L' : 'R';
    }
    hover(side);
  });
  app.addEventListener('pointerleave', function () { if (S.screen === 'game') hover(null); });
  app.addEventListener('focusin', function (e) {
    var b = e.target.closest('[data-side]');
    if (b && S.screen === 'game' && S.run && !E.view(S.run, C).same) setPreview(b.getAttribute('data-side'));
  });
  document.addEventListener('keydown', function (e) {
    if (S.screen !== 'game' || S.busy) return;
    if (e.key === 'ArrowLeft') commit('L');
    else if (e.key === 'ArrowRight') commit('R');
  });

  load();
  renderTitle();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
